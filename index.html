<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecionando…</title>
<meta http-equiv="refresh" content="2;url=https://ofertaliberadas.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0f1412}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:'Manrope',system-ui,sans-serif;color:#f2f5f3}
.w{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
.k{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#3ddc84}
h1{margin:0;font-size:30px;line-height:1.2;font-weight:800}
.t{width:100%;height:6px;border-radius:99px;background:#232b27;overflow:hidden}
.b{height:100%;width:0;border-radius:99px;background:#3ddc84;animation:f 2s linear forwards}
@keyframes f{to{width:100%}}
p{margin:0;font-size:15px;font-weight:500;color:#a9b5ae}
a{color:#3ddc84;font-weight:700}a:hover{color:#7cf0b0}
</style>
</head>
<body>
<div class="w">
  <div class="k">Ofertas Liberadas</div>
  <h1>Redirecionando para a oferta</h1>
  <div class="t"><div class="b"></div></div>
  <p>Se não for redirecionado, <a href="https://ofertaliberadas.com">clique aqui</a>.</p>
</div>
<script>setTimeout(function(){location.replace("https://ofertaliberadas.com")},2000);</script>
</body>
</html>
