<!DOCTYPE html>

<head>

<style>
html,body{margin:0;min-height:100%;background:#fff}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:'Manrope',system-ui,sans-serif;color:#111}

h1{margin:0;font-size:28px;line-height:1.2;font-weight:800;text-wrap:pretty}
h1 span{color:#e5161b}
p{margin:0;font-size:16px;line-height:1.5;font-weight:500;color:#444;text-wrap:pretty}
.t{width:100%;height:6px;border-radius:99px;background:#f1e3e3;overflow:hidden}
.b{height:100%;width:0;border-radius:99px;background:#e5161b;animation:f 2s linear forwards}

<script>
var msg="Olá! Vim pelo anúncio do AiEngage e quero receber leads de clientes da minha região. Pode me explicar como funciona?";

setTimeout(function(){location.href=url},2000);
